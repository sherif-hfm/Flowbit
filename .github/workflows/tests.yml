name: Flowbit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Check Docker access
        run: docker info --format '{{.ServerVersion}}'
      - name: Run test suite
        run: dotnet test Flowbit/Flowbit.slnx --nologo --verbosity normal

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Check Docker access
        run: docker info --format '{{.ServerVersion}}'
      - name: Publish hosts
        run: |
          dotnet publish Flowbit/src/Flowbit.Api/Flowbit.Api.csproj -c Release -o artifacts/browser/hosts/api /p:UseAppHost=false
          dotnet publish Flowbit/src/Flowbit.Ui/Flowbit.Ui.csproj -c Release -o artifacts/browser/hosts/ui /p:UseAppHost=false
      - name: Build browser suite
        run: dotnet build Flowbit/tests/Flowbit.BrowserTests/Flowbit.BrowserTests.csproj -c Release
      - name: Install Chromium
        run: pwsh Flowbit/tests/Flowbit.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run browser smoke suite
        run: >
          dotnet test Flowbit/tests/Flowbit.BrowserTests/Flowbit.BrowserTests.csproj
          -c Release --no-build --no-restore
          --logger "trx;LogFileName=browser-smoke.trx"
          --results-directory artifacts/browser/test-results
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: |
            artifacts/browser/runs/
            artifacts/browser/test-results/
          retention-days: 14
          if-no-files-found: warn
