# Local development stack. The UI shares one development identity per process.
# Keep published ports on loopback; see docs/deployment.md for production setup.
name: flowbit

x-jwt-environment: &jwt-environment
  Jwt__Issuer: ${FLOWBIT_JWT_ISSUER:-flowbit-local}
  Jwt__Audience: ${FLOWBIT_JWT_AUDIENCE:-flowbit-api}
  Jwt__Key: ${FLOWBIT_JWT_KEY:-flowbit-local-development-signing-key-change-me-2026}

x-runtime-environment: &runtime-environment
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__Flowbit: Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowbit};Username=${POSTGRES_USER:-flowbit}
  # Npgsql reads the password separately so quotes/semicolons are not parsed as connection-string syntax.
  PGPASSWORD: ${POSTGRES_PASSWORD:-flowbit-local-only}
  WorkflowContext__AllowedClaims__0: depId

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowbit}
      POSTGRES_USER: ${POSTGRES_USER:-flowbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowbit-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Flowbit/src/Flowbit.Api/Dockerfile
    environment:
      <<: [*runtime-environment, *jwt-environment]
      ASPNETCORE_HTTP_PORTS: "8080"
      WorkflowDurableProcessing__PublicationEnabled: "true"
    ports:
      - "127.0.0.1:${FLOWBIT_API_PORT:-15017}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Development startup finishes database migrations before serving OpenAPI.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "--output", "/dev/null", "http://127.0.0.1:8080/openapi/v1.json"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Flowbit/src/Flowbit.Worker/Dockerfile
    environment:
      <<: *runtime-environment
      FlowbitWorker__HealthListenUrl: http://0.0.0.0:8081
    ports:
      - "127.0.0.1:${FLOWBIT_WORKER_PORT:-18081}:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
    stop_grace_period: 45s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Flowbit/src/Flowbit.Ui/Dockerfile
    environment:
      <<: *jwt-environment
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      WorkflowApi__BaseUrl: http://api:8080
    ports:
      - "127.0.0.1:${FLOWBIT_UI_PORT:-15152}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Check the interactive framework as well as server-rendered markup.
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:8080/token && curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:8080/_framework/blazor.web.js"]
      interval: 10s
      timeout: 11s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
