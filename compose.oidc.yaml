# Optional identity provider for host-run Flowbit.Api and Flowbit.Ui.
# This is a separate local development stack, not an override for compose.yaml.
name: flowbit-oidc

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: flowbit-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: flowbit-keycloak-local-only
      KC_HOSTNAME: http://localhost:18080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./dev/keycloak/flowbit-realm.json:/opt/keycloak/data/import/flowbit-realm.json:ro
      - ./dev/keycloak/themes/flowbit:/opt/keycloak/themes/flowbit:ro
      - ./Flowbit/src/Flowbit.Ui/wwwroot/branding:/opt/keycloak/themes/flowbit/login/resources/img/branding:ro
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

volumes:
  keycloak-data:
